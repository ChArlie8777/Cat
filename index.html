<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Battle Cats - Fullscreen SPA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Impact&family=Noto+Sans+TC:wght@700;900&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* 徹底防止畫面出現滾動條或上下擠壓 */
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 關鍵：獨立全螢幕頁面設定 (強制滿版獨立，絕不平分) */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
        }

        .page-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.02);
            visibility: hidden;
        }

        .page-active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            visibility: visible;
        }

        /* 遊戲風 Skip 按鈕樣式 (第一頁) */
        .btn-skip {
            font-family: 'Impact', 'Noto Sans TC', sans-serif;
            background: linear-gradient(180deg, #fff366 0%, #ffcc00 50%, #e6a100 100%);
            border: 3.5px solid #000;
            box-shadow: 0 5px 0 #000, inset 0 2px 3px rgba(255, 255, 255, 0.9), 0 8px 16px rgba(0,0,0,0.6);
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.5);
            transition: all 0.08s ease-in-out;
        }

        .btn-skip:active {
            transform: translateY(4px) scale(0.95);
            box-shadow: 0 1px 0 #000, inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        /* 背景地獄漸變 (第一頁) */
        .flame-bg {
            background: radial-gradient(circle at 50% 100%, #610400 0%, #290100 50%, #000000 90%);
        }

        /* 貓咪發光紅眼 */
        .glowing-eyes {
            filter: drop-shadow(0 0 8px #ff0000);
            animation: blink-eyes 3.5s infinite alternate ease-in-out;
        }

        @keyframes blink-eyes {
            0%, 90%, 100% { opacity: 1; }
            93%, 95% { opacity: 0.2; }
        }

        /* 第二頁選單黃色按鈕 */
        .btn-menu-yellow {
            background: linear-gradient(180deg, #ffea6b 0%, #ffb700 50%, #d88900 100%);
            border: 3.5px solid #000000;
            box-shadow: 0 5px 0 #000000, inset 0 3px 2px rgba(255, 255, 255, 0.8);
            color: #000;
            text-shadow: 1px 1px 0px #fff;
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
        }

        /* 微縮角與微點擊視覺效果 */
        .btn-menu-yellow:active {
            transform: translateY(4px) scale(0.96) rotate(-0.5deg);
            box-shadow: 0 1px 0 #000000, inset 0 2px 4px rgba(0, 0, 0, 0.5);
            filter: brightness(0.92);
        }

        /* 第二頁主標題字體描邊效果 */
        .cats-logo-text-1 {
            color: #ff66c4;
            -webkit-text-stroke: 2.5px #000;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }
        .cats-logo-text-2 {
            color: #ff9900;
            -webkit-text-stroke: 2.5px #000;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }

        /* 隱藏原生滾動條 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 第三頁背景完全防拖拽與鎖定 */
        #page-3 {
            touch-action: none;
            overscroll-behavior: none;
        }

        /* 卡片輪播軌道 */
        .stage-card {
            transition: transform 0.25s ease, filter 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-black text-white">

    <!-- JavaScript：頁面控制與控制邏輯 -->
    <script>
        function goToPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => {
                page.classList.remove('page-active');
                page.classList.add('page-hidden');
            });

            const targetId = typeof pageId === 'number' ? `page-${pageId}` : `page-${pageId}`;
            const targetPage = document.getElementById(targetId);
            
            if (targetPage) {
                targetPage.classList.remove('page-hidden');
                targetPage.classList.add('page-active');
            }
        }

        function handleButtonClick(targetPage) {
            setTimeout(() => {
                goToPage(targetPage);
            }, 120);
        }

        function toggleInquiryCode() {
            const codeElem = document.getElementById('inquiry-code');
            if (codeElem.innerText.includes('點擊後顯示')) {
                codeElem.innerText = '詢問碼：BC-8894-3201';
            } else {
                codeElem.innerText = '詢問碼：點擊後顯示';
            }
        }

        /* 輪播切換邏輯 */
        let currentIndex = 0;
        const totalCards = 5;
        const messages = [
            "請選擇你要挑戰的世界篇！",
            "不死生物全面侵襲中！",
            "迎戰宇宙強敵，展開星際大戰！",
            "游擊經驗值關卡舉辦中！",
            "極排行榜會場舉辦中！"
        ];

        function slideCarousel(direction) {
            currentIndex = (currentIndex + direction + totalCards) % totalCards;
            scrollToCard(currentIndex);
        }

        function scrollToCard(index) {
            currentIndex = index;
            const track = document.getElementById('carousel-track');
            const cards = track.children;
            if (cards[index]) {
                cards[index].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
            
            const bubble = document.getElementById('dialogue-bubble');
            if (bubble) bubble.innerText = messages[index];
            
            // 卡片置中放大高亮效果
            Array.from(cards).forEach((card, idx) => {
                if (idx === index) {
                    card.style.transform = "scale(1.1)";
                    card.style.boxShadow = "0 0 35px rgba(255, 215, 0, 0.9)";
                    card.style.filter = "brightness(1.05)";
                    card.style.zIndex = "10";
                } else {
                    card.style.transform = "scale(0.88)";
                    card.style.boxShadow = "0 10px 15px rgba(0,0,0,0.6)";
                    card.style.filter = "brightness(0.7)";
                    card.style.zIndex = "1";
                }
            });
        }

        /* 滾輪滾動監聽（只移動卡片，不帶動背景） */
        const track = document.getElementById('carousel-track');
        if (track) {
            track.addEventListener('wheel', (evt) => {
                evt.preventDefault();
                evt.stopPropagation();
                if (evt.deltaY > 0 || evt.deltaX > 0) {
                    slideCarousel(1);
                } else if (evt.deltaY < 0 || evt.deltaX < 0) {
                    slideCarousel(-1);
                }
            }, { passive: false });
        }

        /* 點擊各個框框跳轉至對應詳細頁 */
        const stageData = {
            'world': { title: '世界篇', icon: '🌍', desc: '征服世界各地，收集寶物吧！' },
            'future': { title: '未來篇', icon: '🛸', desc: '迎向未來，對抗外星侵略者！' },
            'cosmos': { title: '宇宙篇', icon: '🌌', desc: '探索浩瀚宇宙，挑戰最強神明！' },
            'legend': { title: '傳奇故事 (貓咪大戰爭)', icon: '🔥', desc: '進入傳奇關卡，發掘未知的傳說貓咪！' },
            'dojo': { title: '貓咪道場', icon: '🏯', desc: '測試隊伍實力，挑戰最高得分排行榜！' }
        };

        function selectStage(index, stageKey) {
            if (currentIndex !== index) {
                scrollToCard(index);
                return;
            }
            const data = stageData[stageKey];
            if (data) {
                document.getElementById('detail-title').innerText = data.title;
                document.getElementById('detail-icon').innerText = data.icon;
                document.getElementById('detail-desc').innerText = data.desc;
                goToPage('stage-detail');
            }
        }

        window.addEventListener('load', () => {
            scrollToCard(0);
        });

        /* 火焰粒子引擎 (原版) */
        const canvas = document.getElementById('fireCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            class FireParticle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * width;
                    this.y = height + Math.random() * 50;
                    this.vx = (Math.random() - 0.5) * 1.8;
                    this.vy = -Math.random() * 3.5 - 1.5;
                    this.radius = Math.random() * 12 + 4;
                    this.alpha = Math.random() * 0.8 + 0.2;
                    this.life = 0;
                    this.maxLife = Math.random() * 80 + 60;
                    const colors = ['rgba(255, 30, 0, ', 'rgba(255, 90, 0, ', 'rgba(255, 160, 0, ', 'rgba(200, 10, 0, '];
                    this.colorBase = colors[Math.floor(Math.random() * colors.length)];
                }
                update() {
                    this.x += this.vx + Math.sin(this.life * 0.05) * 0.8;
                    this.y += this.vy;
                    this.life++;
                    this.radius *= 0.985;
                    const lifeRatio = this.life / this.maxLife;
                    this.currentAlpha = this.alpha * (1 - lifeRatio);
                    if (this.life >= this.maxLife || this.radius <= 0.5 || this.y < height * 0.2) { this.reset(); }
                }
                draw(ctx) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2);
                    ctx.fillStyle = this.colorBase + Math.max(0, this.currentAlpha) + ')';
                    ctx.shadowColor = '#ff3300';
                    ctx.shadowBlur = this.radius * 2;
                    ctx.fill();
                    ctx.restore();
                }
            }

            const particleCount = Math.min(Math.floor(width / 8), 140);
            const particles = Array.from({ length: particleCount }, () => new FireParticle());

            function animateFire() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(ctx); });
                requestAnimationFrame(animateFire);
            }

            onload = () => { animateFire(); };
        }
    </script>
</body>
</html>
